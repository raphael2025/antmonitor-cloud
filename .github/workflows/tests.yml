name: Regression tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 has no hosted build on the current ubuntu-latest image.
          - python: '3.8'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-latest
          - python: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run Python and browser behavior regressions
        run: python -m pytest -q
      - name: Check installation script syntax
        run: bash -n install.sh
